<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽕야뽕야</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1F2A44; --muted:#667085; --line:#D9DEE6; --grid:#EBEEF3;
  --c-pay:#7A4E91; --c-photo:#2F6EA5; --c-dress:#8A6D3B; --c-ready:#3F7E5E; --c-guest:#B5651D; --c-buffet:#B23E63; --c-week:#1F2A44; --c-home:#2F7F8C;
  --today:#D2343B; --done:#9AA1AE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151D; --surface:#19202C; --ink:#E7EAF0; --muted:#98A1B3; --line:#2D3546; --grid:#212938;
    --c-pay:#B48BC9; --c-photo:#6FA6D6; --c-dress:#C7A56A; --c-ready:#76B595; --c-guest:#E09A55; --c-buffet:#E27C9E; --c-week:#C9D2E6; --c-home:#6FC3CF;
    --today:#FF6B6B; --done:#5E6676;
  }
}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#19202C; --ink:#E7EAF0; --muted:#98A1B3; --line:#2D3546; --grid:#212938;
  --c-pay:#B48BC9; --c-photo:#6FA6D6; --c-dress:#C7A56A; --c-ready:#76B595; --c-guest:#E09A55; --c-buffet:#E27C9E; --c-week:#C9D2E6; --c-home:#6FC3CF;
  --today:#FF6B6B; --done:#5E6676;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
header.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}
h1{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 6px;letter-spacing:-0.01em}
.sub{color:var(--muted);margin:0}
.dday{text-align:right}
.dday .num{font-family:"Gowun Batang",serif;font-size:clamp(40px,9vw,68px);line-height:1;font-weight:700}
.dday .lbl{color:var(--muted);font-size:13px}
.progress{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--c-ready);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,.cell:focus-visible,.row:focus-visible{outline:2px solid var(--c-photo);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:8px;border-radius:2px;display:inline-block}
.sw.rec{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);border:1px solid var(--muted)}
.sw.fix{background:var(--muted)}
.sw.ms{width:10px;height:10px;transform:rotate(45deg);background:var(--muted);border-radius:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* Gantt */
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gantt{position:relative;width:max-content;min-width:100%}
.grow{display:flex;min-height:30px;border-bottom:1px solid var(--grid)}
.glbl{position:sticky;left:0;z-index:3;width:210px;flex:0 0 210px;background:var(--surface);display:flex;align-items:center;gap:6px;padding:4px 8px;border-right:1px solid var(--line);font-size:13px}
.glbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;flex:1}
.glbl input{margin:0;accent-color:var(--c-ready);flex:0 0 auto;width:15px;height:15px}
.track{position:relative;flex:0 0 auto}
.ghead{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .glbl{font-weight:600;color:var(--muted);z-index:5}
.month{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.ggroup .glbl{font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;background:var(--bg)}
.ggroup .track{background:var(--bg)}
.gbar{position:absolute;top:8px;height:14px;border-radius:3px;cursor:pointer}
.gbar.rec{background:repeating-linear-gradient(135deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 35%,transparent) 4px 8px);border:1px solid var(--c)}
.gbar.fix{background:var(--c)}
.gms{position:absolute;top:9px;width:12px;height:12px;transform:rotate(45deg);background:var(--c);border-radius:2px;cursor:pointer;box-shadow:0 0 0 2px var(--surface)}
.gms.big{width:16px;height:16px;top:7px}
.isdone .gbar,.isdone .gms{opacity:.35}
.isdone .glbl .t{text-decoration:line-through;color:var(--done)}
.overlay{position:absolute;top:0;bottom:0;pointer-events:none;z-index:2}
.mline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tline{position:absolute;top:0;bottom:0;width:2px;background:var(--today)}
.tline b{position:absolute;top:2px;left:4px;font-size:11px;color:var(--today);background:var(--surface);padding:0 3px;border-radius:3px;white-space:nowrap}
.dline{position:absolute;top:0;bottom:0;width:2px;background:var(--c-buffet);opacity:.5}

/* detail */
.detail{margin-top:14px;padding:14px 16px;display:none}
.detail.on{display:block}
.detail h3{font-family:"Gowun Batang",serif;margin:0 0 4px;font-size:18px}
.detail .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
.detail p{margin:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-left:6px}

/* Calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav h2{font-family:"Gowun Batang",serif;margin:0;font-size:24px}
.calnav button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}
.calnav button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:12px;font-weight:600;text-align:center;padding:6px 0;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.dow.sun{color:var(--c-buffet)}.dow.sat{color:var(--c-photo)}
.cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.out{background:var(--bg);cursor:default}
.cell .dn{font-size:12px;font-weight:600}
.cell.sun .dn{color:var(--c-buffet)}.cell.sat .dn{color:var(--c-photo)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cell.sel{background:color-mix(in srgb,var(--c-photo) 10%,var(--surface))}
.cell.wedding{background:color-mix(in srgb,var(--c-buffet) 14%,var(--surface))}
.chip{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:3px;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.4;text-decoration:line-through}
.dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.dots i{height:3px;flex:1 1 8px;max-width:22px;border-radius:2px;background:var(--c);opacity:.55}
.mlist{margin-top:16px;padding:6px 0}
.mlist h3{font-family:"Gowun Batang",serif;font-size:17px;margin:8px 16px}
.mi{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 16px;border-top:1px solid var(--grid);align-items:start}
.mi input{margin-top:4px;accent-color:var(--c-ready);width:16px;height:16px}
.mi .tt{font-weight:600;cursor:pointer}
.mi .tt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:7px;vertical-align:1px}
.mi .dd{grid-column:2;font-size:13px;color:var(--muted)}
.mi.isdone .tt{text-decoration:line-through;color:var(--done)}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}
.foot p{margin:4px 0}
/* Budget */
.bsum{padding:16px 18px;margin-bottom:14px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--grid);margin:2px 0 16px}
.stack i{display:block;height:100%}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fig .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fig .v{font-family:"Gowun Batang",serif;font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.25}
.fig .s{font-size:12px;color:var(--muted)}
.next{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--grid);font-size:14px}
.next b{font-weight:600}
.blist{margin-bottom:14px;padding:4px 0}
.blist h3,.badd h3{font-family:"Gowun Batang",serif;font-size:18px;margin:10px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.blist h3 small{font-family:"IBM Plex Sans KR",sans-serif;font-size:15px;font-weight:600}
.bnote{margin:0 16px 8px;font-size:13px;color:var(--muted)}
.bmon{display:flex;justify-content:space-between;padding:7px 16px;font-size:13px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);background:var(--bg)}
.brow{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--grid)}
.brow.off .bt,.brow.off .amt{opacity:.45}
.bt{font-weight:600}
.kind{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.bm{font-size:13px;color:var(--muted)}
.amt{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.amt input{width:80px;font:inherit;font-size:15px;font-weight:600;text-align:right;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.bacts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.bbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.bbtn.pay{background:var(--ink);color:var(--bg)}
.binc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.binc input{accent-color:var(--c-dress)}
.badd{padding:4px 16px 16px}
.badd h3{margin-left:0}
.addrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
.addrow input{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 9px;min-width:0}
@media (max-width:640px){
  .brow{grid-template-columns:1fr auto}
  .bacts{grid-column:1/-1}
  .figs{grid-template-columns:1fr 1fr}
  .addrow{grid-template-columns:1fr 1fr}
}
.tabbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.tabbar .tabs{margin-bottom:0}
.xlwrap{margin-left:auto;display:flex;align-items:center;gap:10px}
.xl{font:inherit;font-weight:600;border:1.5px solid var(--c-ready);color:var(--c-ready);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
.xl:hover{background:color-mix(in srgb,var(--c-ready) 10%,var(--surface))}
.xl:disabled{opacity:.6;cursor:wait}
.xlmsg{font-size:13px;color:var(--muted)}
/* Vendors */
.vend{margin-top:14px;padding:4px 0 8px}
.vend h3{font-family:"Gowun Batang",serif;font-size:18px;margin:12px 16px 2px}
.vnote{margin:0 16px 8px;font-size:13px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:minmax(150px,1fr) 1.5fr auto;gap:6px 14px;align-items:center;padding:10px 16px;border-top:1px solid var(--grid)}
.vn{font-weight:600}.vc{font-size:12px;color:var(--muted)}
.va{font-size:13px;color:var(--muted)}
.vt{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.vt span{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--ink);background:var(--surface)}
.vb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.vb a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:4px 11px;color:var(--ink);white-space:nowrap}
.vb a.ok{background:var(--ink);color:var(--bg)}
.vb input{width:118px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 7px}
.vcards{margin-top:12px;border-top:1px solid var(--grid);padding-top:10px}
.vct{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.vcard{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.vcard .vn .vc{font-weight:400;margin-left:6px}
.vcard .vb{grid-row:1/3;grid-column:2}
@media (max-width:640px){.vcard{grid-template-columns:1fr}.vcard .vb{grid-row:auto;grid-column:auto;justify-content:flex-start;margin-top:6px}}
@media (max-width:640px){.vrow{grid-template-columns:1fr}.vb{justify-content:flex-start}}
[hidden]{display:none!important}
@media (max-width:640px){
  .glbl{width:150px;flex-basis:150px;font-size:12px}
  .cell{min-height:64px;padding:3px}
  .chip{font-size:0;height:5px;padding:0;border-radius:2px}
  header.top{grid-template-columns:1fr}
  .dday{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>뽕야뽕야</h1>
      <p class="sub">K웨딩홀 2027년 4월 18일(일) 12시 / 주례 없는 예식</p>
    </div>
    <div class="dday"><div class="num" id="dday">D-</div><div class="lbl" id="ddayLbl"></div></div>
  </header>

  <div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>

  <div class="tabbar">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="gantt">간트 차트</button>
    <button role="tab" aria-selected="false" data-view="cal">달력</button>
    <button role="tab" aria-selected="false" data-view="budget">예산</button>
  </div>
  <div class="xlwrap"><span id="xlMsg" class="xlmsg" role="status"></span><button class="xl" id="xlBtn" hidden>엑셀 다운로드</button></div>
  </div>

  <div class="legend" id="legend"></div>

  <section id="view-gantt">
    <div class="panel gscroll"><div class="gantt" id="gantt"></div></div>
  </section>

  <section id="view-cal" hidden>
    <div class="calnav">
      <button id="prev" aria-label="이전 달">‹</button>
      <h2 id="calTitle"></h2>
      <button id="next" aria-label="다음 달">›</button>
    </div>
    <div class="panel" style="overflow:hidden"><div class="cal" id="cal"></div></div>
    <div class="panel mlist" id="mlist"></div>
  </section>

  <section id="view-budget" hidden>
    <div class="panel bsum" id="bSum"></div>
    <div class="panel blist" id="bDue"></div>
    <div class="panel blist" id="bPaid"></div>
    <div class="panel blist" id="bHome"></div>
    <div class="panel badd">
      <h3>견적 받은 항목 추가</h3>
      <div class="addrow">
        <input id="nT" placeholder="항목 (예: 예복 대여)" aria-label="항목">
        <input id="nA" type="number" min="0" inputmode="numeric" placeholder="금액(만 원)" aria-label="금액">
        <input id="nD" type="date" aria-label="지불 예정일">
        <button class="bbtn pay" id="nAdd">추가</button>
      </div>
    </div>
  </section>

  <div class="panel detail" id="detail" aria-live="polite"></div>

  <div class="foot">
    <p>실선은 계약서/안내문에 적힌 기한, 빗금은 일반적인 준비 순서를 기준으로 잡은 권장 일정입니다.</p>
    <p>체크한 항목과 예산 입력값은 이 브라우저에만 저장됩니다. 예산에서 지불 완료를 누르면 연결된 일정도 완료로 표시됩니다.</p>
  </div>
</div>

<script>
const CATS={
  pay:{n:"계약/결제",v:"--c-pay"},
  photo:{n:"스튜디오/사진",v:"--c-photo"},
  dress:{n:"드레스/예물/혼수",v:"--c-dress"},
  ready:{n:"본식 준비",v:"--c-ready"},
  guest:{n:"청첩장/하객",v:"--c-guest"},
  buffet:{n:"뷔페",v:"--c-buffet"},
  week:{n:"예식 주간",v:"--c-week"},
  home:{n:"신혼집 전세",v:"--c-home"}
};
// b: fix = 계약서/안내문 기한, rec = 권장
const T=[
 {id:"p0",c:"pay",t:"웨딩홀 계약금 35만 원 입금",s:"2026-10-09",ms:1,b:"fix",done:1,n:"입금 완료."},
 {id:"p1",c:"pay",t:"뷔페 계약금 50만 원 입금",s:"2026-10-09",ms:1,b:"fix",done:1,n:"입금 완료. 예식 당일 식사비 총액에서 50만 원 차감."},
 {id:"p2",c:"pay",t:"촬영 중도금 150만 원 결제",s:"2026-10-25",ms:1,b:"fix",done:1,n:"10-25(일) 웨딩홀 상담실에서 카드 결제 완료. 계약서 기준 촬영 10일 전까지 완불. 평일인 10/16까지 처리 권장. 카드 결제는 웨딩홀 방문 필요."},
 {id:"p3",c:"pay",t:"위약금 없는 마지막 날 (D-150)",s:"2026-11-19",ms:1,b:"fix",n:"이후 해제 시 계약 총액의 10%부터 위약금. 패키지라 일부만 해제 불가. 스튜디오 촬영은 이미 위약금 기간."},
 {id:"p4",c:"pay",t:"예식 최종 체크 방문 + 잔금 결제",s:"2027-04-08",ms:1,b:"fix",n:"예식 10일 전까지. 잔금 170만 원 + 추가분(아버님 헤어메이크업 1인 5만, 플라워샤워 10만 등). 총 정산 금액 확인 요청."},

 {id:"s1",c:"photo",t:"촬영 의상/원본 구매 결정",s:"2026-10-10",e:"2026-10-16",b:"rec",done:1,n:"원본 구매하기로 결정(10-27 결제). 한복 또는 커플룩 중 하나(혼자 입을 수 있는 옷), 턱시도 1벌 개인 정장 여부, 원본 구매(33만 원) 여부, 루미디아 방문 여부. 루미디아는 한 벌당이 아니라 방문 1회 5만 원이고 추가금 있는 드레스를 고르면 그 금액만 별도(색감 있는 드레스 위주). 스튜디오 촬영 드레스는 투어 개념 없음."},

 {id:"s3",c:"photo",t:"스튜디오 촬영 (소울, 오전)",s:"2026-10-27",ms:1,big:1,b:"fix",done:1,n:"10-27 촬영 완료 (7:30 범일 9층 소울 메이크업실). 현장 결제: 헬퍼비 11만, 원본 33만, 드레스 추가금 38.5만(메리스 16.5 + 첫 드레스 22). 대략 7:00~7:30 시작, 14:00~15:00 종료 (정확한 시간은 스튜디오가 사전 안내). 현장 결제: 도우미비 11만 원(필수), 원본 33만 원(선택), 촬영 드레스 업그레이드 11~20만 원(현장에서 비교 가능). 헤어메이크업은 스튜디오 자체에서 진행(신랑 포함), 헤메 후 드레스 피팅. 신부 속옷은 스킨색, 누브라 준비. 신랑 검정 구두/양말 지참."},

 {id:"s4",c:"photo",t:"수정 컨펌 (셀렉 후 2~3회)",s:"2026-11-23",e:"2026-12-18",b:"rec",n:"11/21 셀렉 후 진행. 원본 구매 시: 원본 파일 수령, 앨범/액자 셀렉 후 2~3번 수정 컨펌, 수정본 파일(앨범 편집용) 수령. 미구매 시: 앨범과 액자만 수령, 수정 컨펌 불가, 사진 파일 없음. 원본 파일은 촬영 후 최대 1년 보관. 앨범 수령 기한은 아직 미확인."},

 {id:"g5",c:"guest",t:"감사장 준비",s:"2027-03-15",e:"2027-04-10",b:"rec",n:"감사장은 결혼식이 끝난 뒤 와 주신 하객분들과, 오지 못했지만 축의금이나 축하를 보내주신 분들께 고마움을 전하는 인사장. 요즘은 예식 사진을 넣은 모바일 감사장(카톡 링크나 이미지)을 많이 씀. 웨딩홀 계약서상 개인 준비 항목이며, 보통 예식 후 1~2주 안에 보냄."},

 {id:"b1",c:"buffet",t:"시식 (김현, 인하, 이재원, 이소현)",s:"2027-03-20",e:"2027-03-28",b:"rec",n:"참석 잠정: 김현, 인하, 이재원(소개해 준 친구), 이소현(재원 아내). 예식 한 달 전(3/18)부터 가능, 주말 첫 예식 시간으로만 예약. 안내 연락 후 예약, 하루 6팀 선착순, 4인이 반드시 함께 방문(나눠서 불가). 웨딩홀 안내가 오면 재원/소현 부부와 가능한 주말을 바로 맞춰 예약. 보증인원 확정(4/3) 전에 다녀오는 것을 권장."},

 {id:"b2",c:"buffet",t:"보증인원 확정, 식권 양가 배분",s:"2027-04-03",ms:1,b:"fix",n:"예식 15일 전까지. 최소 150명, 160명 이상이면 당일 소량 추가 가능. 여유식권 30장 포함해 신랑측/신부측 배분."},

 {id:"j1",c:"home",t:"임대차 신고 (계약 30일 내)",s:"2026-10-26",e:"2026-11-24",b:"fix",n:"계약서 작성일 10-25 기준 30일 내 신고 의무(보증금 6천만 초과). 부동산거래관리시스템(RTMS) 온라인 또는 주민센터. 임차인 혼자 서명된 계약서를 내도 공동신고로 인정. 늦으면 과태료 2~30만 원."},

// Gantt
const GS=pd("2026-10-05"),GE=pd("2027-04-25");
function renderGantt(){
  const DW=window.innerWidth<640?3.2:4.2;
  const days=diff(GS,GE)+1, W=Math.round(days*DW);
  const g=document.getElementById("gantt");
  let h=`<div class="grow ghead"><div class="glbl">할 일</div><div class="track" style="width:${W}px">`;
  let m=new Date(GS.getFullYear(),GS.getMonth(),1); const mlines=[];
  while(m<=GE){
    const st=m<GS?GS:m; const nx=new Date(m.getFullYear(),m.getMonth()+1,1); const en=nx>GE?new Date(GE.getTime()+DAY):nx;
    const l=diff(GS,st)*DW, w=diff(st,en)*DW;
    h+=`<div class="month" style="left:${l}px;width:${w}px">${m.getMonth()===0||m===GS?m.getFullYear()+". ":""}${m.getMonth()+1}월</div>`;
    if(m>=GS)mlines.push(l); m=nx;
  }
  h+=`</div></div>`;
  Object.keys(CATS).forEach(c=>{
    h+=`<div class="grow ggroup"><div class="glbl">${CATS[c].n}</div><div class="track" style="width:${W}px"></div></div>`;
    T.filter(x=>x.c===c).forEach(x=>{
      const l=diff(GS,pd(x.s))*DW, w=Math.max((diff(pd(x.s),pd(x.e))+1)*DW,6);
      const shape=x.ms?`<div class="gms${x.big?' big':''}" data-id="${x.id}" style="--c:${col(c)};left:${l+DW/2-(x.big?8:6)}px" title="${x.t}"></div>`
        :`<div class="gbar ${x.b}" data-id="${x.id}" style="--c:${col(c)};left:${l}px;width:${w}px" title="${x.t}"></div>`;
      h+=`<div class="grow ${done[x.id]?'isdone':''}"><div class="glbl"><input type="checkbox" data-ck="${x.id}" ${done[x.id]?'checked':''} aria-label="${x.t} 완료"><span class="t" data-id="${x.id}" title="${x.t}">${x.t}</span></div><div class="track" style="width:${W}px">${shape}</div></div>`;
    });
  });
  const lw=window.innerWidth<640?150:210;
  let ov=`<div class="overlay" style="left:${lw}px;width:${W}px">`+mlines.map(l=>`<div class="mline" style="left:${l}px"></div>`).join("");
  if(TODAY>=GS&&TODAY<=GE)ov+=`<div class="tline" style="left:${diff(GS,TODAY)*DW+DW/2}px"><b>오늘</b></div>`;
  ov+=`<div class="dline" style="left:${diff(GS,WED)*DW+DW/2}px"></div></div>`;
  g.innerHTML=h+ov;
}

const MONTHS=[];{let m=new Date(2026,9,1);while(m<=new Date(2027,3,1)){MONTHS.push(new Date(m));m=new Date(m.getFullYear(),m.getMonth()+1,1)}}
let mi=Math.max(0,MONTHS.findIndex(m=>m.getFullYear()===TODAY.getFullYear()&&m.getMonth()===TODAY.getMonth()));
let selDay=null;
function renderCal(){
  const m=MONTHS[mi], y=m.getFullYear(), mo=m.getMonth();
  document.getElementById("calTitle").textContent=`${y}년 ${mo+1}월`;
  document.getElementById("prev").disabled=mi===0;
  document.getElementById("next").disabled=mi===MONTHS.length-1;
  let h="일월화수목금토".split("").map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join("");
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  for(let i=0;i<first.getDay();i++)h+=`<div class="cell out"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(y,mo,d), dow=dt.getDay();
    const pts=T.filter(x=>(x.ms||x.s===x.e)&&pd(x.s).getTime()===dt.getTime());
    const rng=T.filter(x=>!x.ms&&x.s!==x.e&&pd(x.s)<=dt&&pd(x.e)>=dt);
    const cats=[...new Set(rng.map(x=>x.c))];
    const key=`${y}-${mo+1}-${d}`;
    h+=`<div class="cell ${dow===0?'sun':dow===6?'sat':''} ${dt.getTime()===TODAY.getTime()?'today':''} ${dt.getTime()===WED.getTime()?'wedding':''} ${selDay===key?'sel':''}" tabindex="0" data-day="${key}">
      <span class="dn">${d}</span>
      ${pts.map(x=>`<span class="chip ${done[x.id]?'done':''}" style="--c:${col(x.c)}">${x.t}</span>`).join("")}
      ${rng.filter(x=>pd(x.s).getTime()===dt.getTime()||pd(x.e).getTime()===dt.getTime()).slice(0,2).map(x=>`<span class="chip ${done[x.id]?'done':''}" style="--c:${col(x.c)};opacity:.75">${pd(x.s).getTime()===dt.getTime()?'시작 ':'마감 '}${x.t}</span>`).join("")}
      <span class="dots">${cats.map(c=>`<i style="--c:${col(c)}"></i>`).join("")}</span>
    </div>`;
  }
  const tail=(7-((first.getDay()+last.getDate())%7))%7;
  for(let i=0;i<tail;i++)h+=`<div class="cell out"></div>`;
  document.getElementById("cal").innerHTML=h;

  const items=T.filter(x=>pd(x.s)<=last&&pd(x.e)>=first).sort((a,b)=>pd(a.s)-pd(b.s));
  document.getElementById("mlist").innerHTML=`<h3>${mo+1}월에 걸친 일정 ${items.length}건</h3>`+items.map(x=>`
    <div class="mi ${done[x.id]?'isdone':''}"><input type="checkbox" data-ck="${x.id}" ${done[x.id]?'checked':''} aria-label="${x.t} 완료">
      <span class="tt" data-id="${x.id}" style="--c:${col(x.c)}">${x.t}</span>
      <span class="dd">${range(x)} / ${x.b==="fix"?"계약서 기한":"권장 일정"}</span></div>`).join("");
}

  // ---- 분류별 결산 ----
  const C={};
  header(C,["분류","지출 완료","예정 지출","합계","비중"]);
  CAT_ORDER.forEach((k,i)=>{const R=i+1,E=R+1;
    const inC=rows.filter(r=>r.cat===k);
    const p=inC.reduce((s,r)=>s+(r.paid&&r.amt?r.amt:0),0), q=inC.reduce((s,r)=>s+(!r.paid&&r.amt?r.amt:0),0);
    const rng=c=>`'가계부'!$${c}$2:$${c}$${MAXR}`;
    put(C,R,0,k,S.ctr);
    put(C,R,1,{f:`SUMIFS(${rng("I")},${rng("D")},$A${E})`,v:p},S.wonOut);
    put(C,R,2,{f:`SUMIFS(${rng("J")},${rng("D")},$A${E})`,v:q},S.wonPlan);
    put(C,R,3,{f:`B${E}+C${E}`,v:p+q},S.won);
    put(C,R,4,{f:`IF('요약'!$B$7=0,0,D${E}/'요약'!$B$7)`,v:goal?(p+q)/goal:0},S.pct);
  });
  const cR=CAT_ORDER.length+1;
  put(C,cR,0,"합계",S.totL);
  ["B","C","D"].forEach((c,j)=>put(C,cR,j+1,{f:`SUM(${c}2:${c}${cR})`,v:[paidW,planW,paidW+planW][j]},S.totW));
  put(C,cR,4,{f:`SUM(E2:E${cR})`,v:1},Object.assign({},S.totW,{numFmt:"0.0%"}));
  C["!rows"]=[{hpt:24}];
  fin(C,cR+1,5,[14,14,14,14,10]);

  // ---- 신혼집 전세 ----
  const Hm={};
  header(Hm,["날짜","상태","항목","금액(원)","결제수단/비고"]);
  homeRows.forEach((x,i)=>{const R=i+1,paid=bPaid(x),a=bAmt(x);
    put(Hm,R,0,serial(paid?bPd(x):x.d),S.date);put(Hm,R,1,paid?"완료":"예정",paid?S.stDone:S.stPlan);
    put(Hm,R,2,x.t,S.txt);put(Hm,R,3,a==null?"":won(a),paid?S.wonOut:S.wonPlan);put(Hm,R,4,x.w||"",S.txt)});
  const hR=homeRows.length+1;
  put(Hm,hR,0,"납부 합계",S.totL);put(Hm,hR,1,"",S.totL);put(Hm,hR,2,"",S.totL);
  put(Hm,hR,3,{f:`SUMIFS(D2:D${hR},B2:B${hR},"완료")`,v:homePaidW},S.totW);put(Hm,hR,4,`보증금 ${(JEONSE*10000).toLocaleString("ko-KR")}원, 결혼 예산 3,000만 원과 별도`,S.txt);
  Hm["!rows"]=[{hpt:24}];
  fin(Hm,hR+1,5,[12,8,22,14,48]);

  // ---- 일정 ----
  const T2={};
  const TH=["분류","할 일","시작","마감","유형","기준","완료","메모"];
  header(T2,TH);
  T.slice().sort((a,b)=>pd(a.s)-pd(b.s)||pd(a.e)-pd(b.e)).forEach((x,i)=>{const R=i+1;
    put(T2,R,0,CATS[x.c].n,S.ctr);put(T2,R,1,x.t,S.txt);put(T2,R,2,serial(x.s),S.date);put(T2,R,3,serial(x.e),S.date);
    put(T2,R,4,x.ms?"마일스톤":"기간",S.ctr);put(T2,R,5,x.b==="fix"?"계약서 기한":"권장 일정",S.ctr);
    put(T2,R,6,done[x.id]?"완료":"",done[x.id]?S.stDone:S.ctr);put(T2,R,7,x.n||"",S.txt);
  });
  T2["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:T.length,c:TH.length-1}})};
  T2["!rows"]=[{hpt:24}];
  fin(T2,T.length+1,TH.length,[14,32,11,11,9,11,7,70]);

  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,A,"요약");
  X.utils.book_append_sheet(wb,G,"가계부");
  X.utils.book_append_sheet(wb,M,"월별 결산");
  X.utils.book_append_sheet(wb,C,"분류별 결산");
  X.utils.book_append_sheet(wb,Hm,"신혼집 전세");
  X.utils.book_append_sheet(wb,T2,"일정");
  return wb;
}

  const btn=document.getElementById("xlBtn"),msg=document.getElementById("xlMsg");
  if(!dlNs)return;
  btn.disabled=true;msg.textContent="파일 만드는 중";
  try{
    const X=await loadXLSX();
    const out=X.write(buildWorkbook(X),{bookType:"xlsx",type:"array",cellStyles:true});
    const r=await dlNs.save({filename:`웨딩가계부_${todayStr().replace(/-/g,"")}.xlsx`,data:new Blob([out])});
    msg.textContent=r&&r.status==="delivered"?"":"저장했습니다";
  }catch(e){
    const c=e&&e.code;
    msg.textContent=c==="declined"?"저장을 취소했습니다"
      :c==="rate_limited"?"저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요"
      :c==="extension_not_enabled"?"이 화면에서는 엑셀 저장을 쓸 수 없습니다"
      :(e&&e.message==="load")?"엑셀 모듈을 불러오지 못했습니다. 네트워크를 확인해 주세요"
      :"저장할 수 없습니다";
    if(["unavailable","not_granted","capability_disabled","capability_removed"].includes(c))btn.hidden=true;
  }finally{btn.disabled=false;setTimeout(()=>{msg.textContent=""},5000)}
};
